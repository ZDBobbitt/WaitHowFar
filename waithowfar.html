<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
	<title>Woah, How Far?</title>
	<style>
		:root {
			--page: #ffffff;
			--panel: #ffffff;
			--ink: #507255;
			--muted: #507255;
			--line: #6EB257;
			--blue: #488B49;
			--blue-dark: #507255;
			--royal-purple: #488B49;
			--royal-blue: #4AAD52;
			--green: #488B49;
			--green-soft: #C5E063;
			--red: #507255;
			--red-soft: #C5E063;
			--orange: #4AAD52;
			--orange-soft: #C5E063;
			--shadow: 0 18px 45px rgba(80, 114, 85, 0.18);
		}

		* {
			box-sizing: border-box;
		}

		body {
			background: var(--page);
			color: var(--ink);
			font-family: Arial, Helvetica, sans-serif;
			margin: 0;
			min-height: 100vh;
		}

		button {
			font: inherit;
		}

		.game-shell {
			margin: 0 auto;
			max-width: 980px;
			padding: 24px;
		}

		.topbar {
			align-items: center;
			display: flex;
			gap: 16px;
			justify-content: space-between;
			margin-bottom: 18px;
		}

		h1 {
			color: #6EB257;
			font-family: "Pacifico", cursive;
			font-size: clamp(1.9rem, 4vw, 3rem);
			font-weight: 400;
			line-height: 1;
			margin: 0;
		}

		.board {
			background: rgba(255, 255, 255, 0.84);
			border: 1px solid var(--line);
			border-radius: 8px;
			box-shadow: var(--shadow);
			overflow: hidden;
		}

		.hero {
			background:
				linear-gradient(135deg, #C5E063, #6EB257),
				var(--panel);
			border-bottom: 1px solid var(--line);
			display: grid;
			gap: 10px;
			padding: 24px;
		}

		.round-label {
			color: #000;
			font-size: 0.78rem;
			font-weight: 700;
			letter-spacing: 0.08em;
			text-transform: uppercase;
		}

		.prompt {
			color: #000;
			font-size: clamp(1.35rem, 3vw, 2.1rem);
			font-weight: 800;
			line-height: 1.15;
		}

		.guess-area {
			display: grid;
			gap: 18px;
			padding: 22px;
		}

		.city-card {
			background: var(--panel);
			border: 1px solid var(--line);
			border-radius: 8px;
			display: grid;
			gap: 18px;
			padding: 18px;
		}

		.option-kicker {
			align-items: center;
			color: var(--muted);
			display: flex;
			font-size: 0.82rem;
			font-weight: 700;
			letter-spacing: 0.08em;
			text-transform: uppercase;
		}

		.city-pair {
			align-items: stretch;
			display: grid;
			gap: 14px;
			grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
		}

		.city-chip {
			border: 1px solid var(--line);
			border-left: 5px solid var(--royal-purple);
			border-radius: 8px;
			display: grid;
			gap: 8px;
			min-height: 96px;
			padding: 14px;
		}

		.city-chip.end {
			border-left-color: var(--royal-blue);
		}

		.city-chip.start .city-name {
			color: var(--royal-purple);
		}

		.city-chip.end .city-name {
			color: var(--royal-blue);
		}

		.city-name {
			font-size: clamp(1.25rem, 3vw, 1.75rem);
			font-weight: 800;
			line-height: 1.08;
			overflow-wrap: anywhere;
		}

		.connector {
			align-self: center;
			color: var(--blue);
			font-weight: 800;
		}

		.guess-form {
			align-items: end;
			border-top: 1px solid var(--line);
			display: flex;
			flex-wrap: wrap;
			gap: 12px;
			padding-top: 16px;
		}

		.guess-field {
			display: grid;
			flex: 1 1 240px;
			gap: 6px;
		}

		.guess-field label {
			color: var(--muted);
			font-size: 0.86rem;
			font-weight: 700;
		}

		.guess-input {
			border: 1px solid var(--line);
			border-radius: 8px;
			color: var(--ink);
			font-size: 1.15rem;
			font-weight: 800;
			padding: 12px 14px;
			width: 100%;
		}

		.guess-input:focus {
			border-color: var(--blue);
			outline: 3px solid rgba(37, 95, 153, 0.18);
		}

		.submit-button {
			background: var(--blue);
			border: 0;
			border-radius: 8px;
			color: #fff;
			cursor: pointer;
			font-weight: 800;
			padding: 13px 18px;
		}

		.submit-button:hover,
		.submit-button:focus-visible {
			background: var(--blue-dark);
		}

		.submit-button:disabled {
			cursor: default;
			opacity: 0.6;
		}

		.answer-panel {
			border-top: 1px solid var(--line);
			display: none;
			gap: 14px;
			padding: 0 22px 22px;
		}

		.answer-panel.show {
			display: grid;
		}

		.answer-message {
			background: var(--panel);
			border: 1px solid var(--line);
			border-radius: 8px;
			display: grid;
			gap: 8px;
			padding: 16px;
		}

		.answer-message strong {
			font-size: 1.15rem;
		}

		.answer-message.win {
			border-color: rgba(31, 122, 77, 0.45);
		}

		.answer-message.loss {
			border-color: rgba(180, 35, 24, 0.45);
		}

		.answer-map {
			background: #fbfcff;
			border: 1px solid var(--line);
			border-radius: 8px;
			margin-top: 6px;
			overflow: hidden;
		}

		.answer-map svg {
			display: block;
			height: auto;
			width: 100%;
		}

		.us-land {
			fill: #e8eef6;
			stroke: #b9c7d8;
			stroke-width: 1.2;
		}

		.state-outline {
			fill: none;
			stroke: #93a6bd;
			stroke-width: 0.72;
			vector-effect: non-scaling-stroke;
		}

		.map-route {
			fill: none;
			stroke-linecap: round;
			stroke: var(--royal-blue);
			stroke-width: 4;
		}

		.map-point {
			fill: var(--panel);
			stroke-width: 3;
		}

		.map-point-start {
			stroke: var(--royal-purple);
		}

		.map-point-end {
			stroke: var(--royal-blue);
		}

		.map-label-bg {
			fill: var(--panel);
			stroke: var(--line);
			stroke-width: 1;
		}

		.map-label {
			fill: var(--blue-dark);
			font-size: 16px;
			font-weight: 800;
			text-anchor: middle;
		}

		.answer-stats {
			display: grid;
			gap: 10px;
			grid-template-columns: repeat(4, minmax(0, 1fr));
		}

		.answer-stat {
			background: #fbfcff;
			border: 1px solid var(--line);
			border-radius: 8px;
			padding: 12px;
		}

		.answer-stat span {
			color: var(--muted);
			display: block;
			font-size: 0.82rem;
			font-weight: 700;
			margin-bottom: 4px;
		}

		.answer-stat strong {
			display: block;
			font-size: 1.18rem;
		}

		.final-summary {
			background: var(--green-soft);
			border: 1px solid rgba(31, 122, 77, 0.32);
			border-radius: 8px;
			display: grid;
			gap: 4px;
			padding: 12px;
		}

		.final-summary span {
			color: var(--muted);
			font-size: 0.82rem;
			font-weight: 700;
			text-transform: uppercase;
		}

		.final-summary strong {
			color: var(--green);
			font-size: 1.4rem;
		}

		.leaderboard-card {
			border: 1px solid var(--line);
			border-radius: 8px;
			display: grid;
			gap: 14px;
			margin-top: 6px;
			padding: 16px;
		}

		.leaderboard-heading {
			align-items: end;
			display: flex;
			flex-wrap: wrap;
			gap: 12px;
			justify-content: space-between;
		}

		.leaderboard-heading h2 {
			color: var(--ink);
			font-size: 1.15rem;
			line-height: 1.1;
			margin: 0;
		}

		.section-kicker {
			color: var(--muted);
			display: block;
			font-size: 0.78rem;
			font-weight: 700;
			letter-spacing: 0.08em;
			margin-bottom: 4px;
			text-transform: uppercase;
		}

		.score-pill {
			background: var(--green-soft);
			border: 1px solid var(--line);
			border-radius: 8px;
			color: var(--ink);
			font-size: 1.1rem;
			padding: 8px 10px;
		}

		.score-form {
			align-items: end;
			display: flex;
			flex-wrap: wrap;
			gap: 12px;
		}

		.leaderboard-status {
			color: var(--muted);
			font-size: 0.92rem;
			font-weight: 700;
		}

		.leaderboard-status.error {
			color: #000;
		}

		.leaderboard-rank {
			border: 1px solid var(--line);
			border-radius: 8px;
			font-weight: 700;
			margin-bottom: 10px;
			padding: 10px;
		}

		.leaderboard-table {
			border-collapse: collapse;
			width: 100%;
		}

		.leaderboard-table th,
		.leaderboard-table td {
			border-top: 1px solid var(--line);
			padding: 9px 6px;
			text-align: left;
		}

		.leaderboard-table th:last-child,
		.leaderboard-table td:last-child {
			text-align: right;
		}

		.leaderboard-table .current-player {
			background: rgba(197, 224, 99, 0.28);
		}

		.actions {
			display: flex;
			flex-wrap: wrap;
			gap: 10px;
		}

		.action-button {
			background: var(--blue);
			border: 0;
			border-radius: 8px;
			color: #fff;
			cursor: pointer;
			font-weight: 800;
			padding: 12px 16px;
		}

		.action-button:hover,
		.action-button:focus-visible {
			background: var(--blue-dark);
		}

		.action-button.secondary {
			background: var(--orange);
		}

		@media (max-width: 760px) {
			.game-shell {
				padding: 16px;
			}

			.topbar {
				align-items: flex-start;
				flex-direction: column;
			}

			.city-pair {
				grid-template-columns: 1fr;
			}

			.connector {
				justify-self: start;
			}

			.answer-stats {
				grid-template-columns: 1fr;
			}
		}
	</style>
</head>

	</main>

						<strong class="score-pill">${formatPercent(score)}</strong>
					</div>
					<form class="score-form" id="scoreForm">
						<div class="guess-field">
							<label for="playerNameInput">Your name</label>
							<input class="guess-input" id="playerNameInput" name="playerName" type="text" maxlength="24" autocomplete="name" required>
						</div>
						<button class="submit-button" type="submit">Submit score</button>
					</form>
					<div class="leaderboard-status" id="leaderboardStatus">Loading leaderboard...</div>
					<div class="leaderboard-results" id="leaderboardResults"></div>
				</section>
			`;
		}

		function renderLeaderboard(entries = [], currentEntryId = "", playerRank = null) {
			const rankBlock = playerRank ? `<div class="leaderboard-rank">Your rank: <strong>#${Number(playerRank).toLocaleString()}</strong></div>` : "";
			if (!entries.length) {
				return `${rankBlock}<div class="leaderboard-status">No saved scores yet.</div>`;
			}

			const rows = entries.map((entry, index) => {
				const rank = Number(entry.rank || index + 1).toLocaleString();
				const isCurrentPlayer = entry.id && entry.id === currentEntryId;
				return `
					<tr class="${isCurrentPlayer ? "current-player" : ""}">
						<td>#${rank}</td>
						<td>${escapeHtml(entry.name)}</td>
						<td>${formatPercent(entry.score)}</td>
					</tr>
				`;
			}).join("");

			return `
				${rankBlock}
				<table class="leaderboard-table">
					<thead>
						<tr>
							<th scope="col">Rank</th>
							<th scope="col">Name</th>
							<th scope="col">Average difference</th>
						</tr>
					</thead>
					<tbody>${rows}</tbody>
				</table>
			`;
		}

		function setLeaderboardStatus(message, isError = false) {
			const statusEl = document.getElementById("leaderboardStatus");
			if (!statusEl) return;
			statusEl.textContent = message;
			statusEl.classList.toggle("error", isError);
		}

		async function loadLeaderboard(currentEntryId = "", playerRank = null) {
			const resultsEl = document.getElementById("leaderboardResults");
			if (!resultsEl) return;
			setLeaderboardStatus("Loading leaderboard...");
			try {
				const response = await fetch(LEADERBOARD_API_URL, {
					headers: { "Accept": "application/json" }
				});
				const data = await response.json().catch(() => ({}));
				if (!response.ok) {
					throw new Error(data.error || "Could not load the leaderboard.");
				}
				const entries = Array.isArray(data.entries) ? data.entries : [];
				resultsEl.innerHTML = renderLeaderboard(entries, currentEntryId, playerRank);
				setLeaderboardStatus(entries.length ? "Lowest average percentage difference takes the top spot." : "No saved scores yet.");
			} catch (error) {
				resultsEl.innerHTML = "";
				setLeaderboardStatus("Leaderboard will appear once the Cloudflare Worker is live.", true);
			}
		}

		async function submitScore(event, score) {
			event.preventDefault();
			const form = event.currentTarget;
			const input = document.getElementById("playerNameInput");
			const button = form.querySelector("button");
			const name = input.value.trim();
			if (!name) {
				input.focus();
				return;
			}

			button.disabled = true;
			button.textContent = "Saving...";
			setLeaderboardStatus("Saving score...");

			try {
				const response = await fetch(LEADERBOARD_API_URL, {
					method: "POST",
					headers: {
						"Accept": "application/json",
						"Content-Type": "application/json"
					},
					body: JSON.stringify({
						name,
						score: Number(score.toFixed(3)),
						rounds: TOTAL_ROUNDS
					})
				});
				const data = await response.json().catch(() => ({}));
				if (!response.ok) {
					throw new Error(data.error || "Score could not be saved.");
				}

				const entry = data.entry || {};
				const entries = Array.isArray(data.entries) ? data.entries : [];
				const resultsEl = document.getElementById("leaderboardResults");
				input.disabled = true;
				button.textContent = "Score saved";
				resultsEl.innerHTML = renderLeaderboard(entries, entry.id, entry.rank);
				setLeaderboardStatus(`You're ranked #${Number(entry.rank || 1).toLocaleString()}. Lowest percentage difference wins.`);
			} catch (error) {
				button.disabled = false;
				button.textContent = "Submit score";
				setLeaderboardStatus(error.message || "Score could not be saved.", true);
			}
		}

		function renderGuessForm() {
			const disabled = answered ? "disabled" : "";
			guessAreaEl.innerHTML = `
				<div class="city-card">
					<div class="city-pair">
						<div class="city-chip start">
							<div class="option-kicker">City 1</div>
							<div class="city-name">${displayCity(round.cities[0])}</div>
						</div>
						<div class="connector">to</div>
						<div class="city-chip end">
							<div class="option-kicker">City 2</div>
							<div class="city-name">${displayCity(round.cities[1])}</div>
						</div>
					</div>
					<form class="guess-form" id="guessForm">
						<div class="guess-field">
							<label for="guessInput">Your guess in miles</label>
							<input class="guess-input" id="guessInput" type="number" min="0" step="1" inputmode="numeric" required value="${round.guess ?? ""}" ${disabled}>
						</div>
						<button class="submit-button" type="submit" ${disabled}>Submit guess</button>
					</form>
				</div>
			`;

			if (!answered) {
				const form = document.getElementById("guessForm");
				const input = document.getElementById("guessInput");
				form.addEventListener("submit", submitGuess);
				input.focus();
			}
		}

		function renderAnswer() {
			const isFinalRound = roundNumber === TOTAL_ROUNDS;
			const averagePercent = averagePercentageDifference();
			answerPanelEl.classList.add("show");
			answerMessageEl.className = `answer-message ${isFinalRound ? "win" : ""}`;
			answerMessageEl.innerHTML = `
				<strong>Difference: ${formatMiles(round.difference)}</strong>
				<div>Percentage difference: ${formatPercent(round.percentDifference)}</div>
				${isFinalRound ? `
					<div class="final-summary">
						<span>Average percentage difference</span>
						<strong>${formatPercent(averagePercent)}</strong>
					</div>
				` : ""}
				${renderAnswerMap()}
				<div class="answer-stats">
					<div class="answer-stat"><span>Your guess</span><strong>${formatMiles(round.guess)}</strong></div>
					<div class="answer-stat"><span>True distance</span><strong>${formatMiles(round.trueMiles)}</strong></div>
					<div class="answer-stat"><span>Difference</span><strong>${formatMiles(round.difference)}</strong></div>
					<div class="answer-stat"><span>Percentage difference</span><strong>${formatPercent(round.percentDifference)}</strong></div>
				</div>
				${isFinalRound ? renderLeaderboardSignup(averagePercent) : ""}
			`;

			actionsEl.innerHTML = "";
			const nextButton = document.createElement("button");
			nextButton.type = "button";
			nextButton.className = `action-button${isFinalRound ? " secondary" : ""}`;
			nextButton.textContent = isFinalRound ? "New game" : "Next round";
			nextButton.addEventListener("click", isFinalRound ? resetGame : nextRound);
			actionsEl.appendChild(nextButton);
			if (isFinalRound) {
				const scoreForm = document.getElementById("scoreForm");
				const nameInput = document.getElementById("playerNameInput");
				scoreForm.addEventListener("submit", (event) => submitScore(event, averagePercent));
				loadLeaderboard();
				nameInput.focus();
			} else {
				nextButton.focus();
			}
		}

		function submitGuess(event) {
			event.preventDefault();
			if (answered) return;
			const input = document.getElementById("guessInput");
			if (typeof input.checkValidity === "function" && !input.checkValidity()) {
				input.reportValidity();
				return;
			}
			const guess = Math.round(Number(input.value));
			if (!Number.isFinite(guess) || guess < 0) return;

			answered = true;
			round.guess = guess;
			round.trueMiles = Math.round(round.distance);
			round.difference = Math.abs(guess - round.trueMiles);
			round.percentDifference = round.trueMiles === 0 ? 0 : (round.difference / round.trueMiles) * 100;
			totalDifference += round.difference;
			history.push({
				round: roundNumber,
				cities: round.cities.map(displayCity),
				guess: round.guess,
				trueMiles: round.trueMiles,
				difference: round.difference,
				percentDifference: round.percentDifference
			});
			updateHeader();
			renderGuessForm();
			renderAnswer();
		}

		function updateHeader() {
			roundLabelEl.textContent = `Round ${roundNumber} of ${TOTAL_ROUNDS}`;
		}

		function startRound() {
			answered = false;
			round = buildRound();
			answerPanelEl.classList.remove("show");
			answerMessageEl.innerHTML = "";
			actionsEl.innerHTML = "";
			updateHeader();
			renderGuessForm();
		}

		function nextRound() {
			roundNumber += 1;
			startRound();
		}

		function resetGame() {
			totalDifference = 0;
			roundNumber = 1;
			history = [];
			startRound();
		}

		resetGame();
	</script>
</body>
</html>
